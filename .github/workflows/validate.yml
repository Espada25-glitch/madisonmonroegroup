name: Validate static website
on:
  pull_request:
  push:
    branches: [codex/growth-advisory-redesign]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check responsive pages and screenshots
        run: python tests/browser_check.py
      - name: Probe GA4 and HubSpot without sending a lead
        run: python tests/tracking_probe.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-review
          path: test-artifacts/
          if-no-files-found: ignore
